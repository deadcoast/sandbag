[package]
name = "sandbag"
version = "0.1.0"
edition = "2021"
authors = ["Sandbag Team"]
description = "Intelligent linter configuration management with mathematical precision"
license = "MIT"
repository = "https://github.com/yourusername/sandbag"
keywords = ["linter", "configuration", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI and user interface
clap = { version = "4.0", features = ["derive"] }
colored = "2.0"
dialoguer = "0.10"
console = "0.15"

# Serialization and configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Pattern matching and text processing
regex = "1.0"
tree-sitter = "0.20"

# Async runtime and file operations
tokio = { version = "1.0", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Collections and utilities
indexmap = "2.0"
dashmap = "5.0"
rayon = "1.8"
indicatif = "0.17"
once_cell = "1.19"

# Mathematical operations
rand = "0.8"
statrs = "0.16"
chrono = { version = "0.4", features = ["serde"] }

# Development dependencies
[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
criterion = "0.5"
assert_cmd = "2.0"
predicates = "3.1"

[[bench]]
name = "rule_extraction_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[features]
default = ["strict-docs"]
advanced-analysis = []
smart-cache = []
slow-tests = []
strict-docs = []
