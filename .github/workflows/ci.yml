name: CI/CD Pipeline

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    test:
        name: Test Suite
        runs-on: ubuntu-latest
        strategy:
            matrix:
                rust: [stable, beta, nightly]
                include:
                    - rust: stable
                      cache-key: stable
                    - rust: beta
                      cache-key: beta
                    - rust: nightly
                      cache-key: nightly

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: ${{ matrix.rust }}
                  override: true
                  components: rustfmt, clippy

            - name: Cache dependencies
              uses: actions/cache@v3
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ matrix.cache-key }}-${{ hashFiles('**/Cargo.lock') }}

            - name: Install dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Run clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Run tests
              run: cargo test --all-features --verbose

            - name: Run integration tests
              run: cargo test --test '*' --all-features --verbose

            - name: Build release
              run: cargo build --release

            - name: Upload test results
              uses: actions/upload-artifact@v3
              if: always()
              with:
                  name: test-results-${{ matrix.rust }}
                  path: |
                      target/test-results/
                      target/coverage/

    security:
        name: Security Audit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true

            - name: Run security audit
              run: |
                  cargo audit --version || cargo install cargo-audit
                  cargo audit

            - name: Check for known vulnerabilities
              run: |
                  if cargo audit 2>&1 | grep -q "Vulnerability found"; then
                    echo "Security vulnerabilities found!"
                    exit 1
                  fi

    performance:
        name: Performance Tests
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true

            - name: Run performance benchmarks
              run: |
                  cargo test --test performance --release
                  cargo bench --all

            - name: Upload benchmark results
              uses: actions/upload-artifact@v3
              with:
                  name: benchmark-results
                  path: target/criterion/

    documentation:
        name: Documentation
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true

            - name: Build documentation
              run: cargo doc --all-features --no-deps

            - name: Check documentation links
              run: cargo doc --all-features --no-deps --document-private-items

            - name: Upload documentation
              uses: actions/upload-artifact@v3
              with:
                  name: documentation
                  path: target/doc/

    lint:
        name: Linting
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true
                  components: rustfmt, clippy

            - name: Check code formatting
              run: cargo fmt --all -- --check

            - name: Run clippy
              run: cargo clippy --all-targets --all-features -- -D warnings

            - name: Check for unused dependencies
              run: cargo check --all-targets --all-features

    build:
        name: Build
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                target:
                    [
                        x86_64-unknown-linux-gnu,
                        x86_64-pc-windows-msvc,
                        x86_64-apple-darwin,
                    ]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true
                  target: ${{ matrix.target }}

            - name: Build for target
              run: cargo build --release --target ${{ matrix.target }}

            - name: Upload build artifacts
              uses: actions/upload-artifact@v3
              with:
                  name: build-${{ matrix.target }}
                  path: target/${{ matrix.target }}/release/

    release:
        name: Release
        runs-on: ubuntu-latest
        needs: [test, security, performance, documentation, lint, build]
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
                  override: true

            - name: Create release
              id: create_release
              uses: actions/create-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  tag_name: v${{ github.run_number }}
                  release_name: Release v${{ github.run_number }}
                  body: |
                      Automated release from CI/CD pipeline

                      ## Changes
                      - Automated build and test
                      - Performance optimizations
                      - Security audit passed
                      - Documentation updated
                  draft: false
                  prerelease: false

            - name: Upload release assets
              uses: actions/upload-release-asset@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  upload_url: ${{ steps.create_release.outputs.upload_url }}
                  asset_path: ./target/release/sandbag
                  asset_name: sandbag-${{ github.run_number }}-x86_64-unknown-linux-gnu
                  asset_content_type: application/octet-stream

    notify:
        name: Notify
        runs-on: ubuntu-latest
        needs:
            [test, security, performance, documentation, lint, build, release]
        if: always()

        steps:
            - name: Notify on failure
              if: failure()
              run: |
                  echo "One or more CI/CD jobs failed!"
                  echo "Please check the logs for details."

            - name: Notify on success
              if: success()
              run: |
                  echo "All CI/CD jobs completed successfully!"
                  echo "Release created: v${{ github.run_number }}"
